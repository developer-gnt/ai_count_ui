# ==============================================================================
# Nginx Configuration for AI Accounting Multi-Tenant App (Frontend + Backend API)
# Place this file in: /etc/nginx/sites-available/aicount.conf
# Enable with: ln -s /etc/nginx/sites-available/aicount.conf /etc/nginx/sites-enabled/
# Test with: nginx -t && systemctl reload nginx
# ==============================================================================

server {
    listen 80;
    server_name aicount.giganexus.info;

    # Max upload limit (for receipts, invoices, attachments)
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # ==============================================================================
    # 1. FRONTEND: Static React/Vite SPA
    # ==============================================================================
    root /var/www/aicount-ui; # Location of the built frontend (dist contents)
    index index.html;

    # Handle React Router SPA client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (CSS, JS, Fonts, Images)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # ==============================================================================
    # 2. BACKEND API: NestJS Reverse Proxy
    # ==============================================================================
    location /api/ {
        proxy_pass http://127.0.0.1:3005; # Backend PM2 process port
        proxy_http_version 1.1;

        # WebSocket / Keep-Alive headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Real client IP forwarding
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for AI processing (Gemini / OCR calls)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    # Deny access to hidden files (e.g. .env, .git)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
