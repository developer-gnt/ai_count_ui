name: Deploy Frontend to VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "🚀 Starting Frontend Auto-Deployment..."
            cd ~/aicount-ui
            git checkout package-lock.json || true
            git pull
            npm install
            npm run build
            
            mkdir -p /var/www/aicount-ui
            rm -rf /var/www/aicount-ui/*
            cp -r dist/* /var/www/aicount-ui/
            chown -R www-data:www-data /var/www/aicount-ui
            chmod -R 755 /var/www/aicount-ui
            echo "✅ Frontend Auto-Deployment Successful!"
